name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Go to project directory and deploy
        run: |
          cd /root/Lab430-lab4
          git pull origin main
          docker network create labo04-network || true
          docker-compose down
          docker-compose build
          docker-compose up -d
          docker-compose ps